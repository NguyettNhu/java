spring:
  datasource:
    url: jdbc:h2:mem:yukihira;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
    url: ${spring.datasource.url}
    user: sa
    password:
  # Test dựng dữ liệu thẳng qua repository nên không kích hoạt được việc xóa cache
  # của ReferenceDataService; tắt cache để mỗi bài test luôn đọc đúng dữ liệu vừa tạo.
  cache:
    type: none
  thymeleaf:
    cache: false
logging:
  level:
    org.hibernate.SQL: WARN
