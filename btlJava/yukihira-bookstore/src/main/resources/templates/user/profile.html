<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hồ sơ | Yukihira Books</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/site :: header}"></header><div th:replace="~{fragments/site :: flash}"></div><main class="profile-shell"><header class="profile-heading"><p class="eyebrow">Thẻ độc giả</p><h1>Thông tin của bạn</h1><p>Cập nhật địa chỉ để lần đặt sách tiếp theo nhanh hơn.</p></header><div class="profile-layout"><aside class="reader-card"><span class="reader-monogram" th:text="${#strings.substring(form.fullName, 0, 1)}"></span><strong th:text="${form.fullName}"></strong><small th:text="${email}"></small><span>YUKIHIRA READER</span></aside><form class="editor-form" th:action="@{/profile}" th:object="${form}" method="post"><label>Họ và tên<input type="text" th:field="*{fullName}" autocomplete="name" required><small class="field-error" th:errors="*{fullName}"></small></label><label>Email đăng nhập<input type="email" th:value="${email}" disabled><small class="optional">Email được dùng để xác định tài khoản và không đổi tại đây.</small></label><label>Số điện thoại<input type="tel" th:field="*{phone}" autocomplete="tel"><small class="field-error" th:errors="*{phone}"></small></label><label>Địa chỉ mặc định<textarea th:field="*{address}" rows="4" autocomplete="street-address"></textarea><small class="field-error" th:errors="*{address}"></small></label><button class="button primary" type="submit">Lưu thông tin</button></form></div></main><footer th:replace="~{fragments/site :: footer}"></footer></body>
</html>
