<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Giỏ sách | Yukihira Books</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/site :: header}"></header><div th:replace="~{fragments/site :: flash}"></div><main class="cart-shell"><header class="page-title"><p class="eyebrow">Danh sách đang chọn</p><h1>Giỏ sách</h1><p th:text="${cart.itemCount() + ' cuốn sách'}"></p></header><div class="empty-state" th:if="${#lists.isEmpty(cart.items)}"><span>籠</span><h2>Giỏ sách còn trống.</h2><p>Đi một vòng qua các kệ và chọn cuốn bạn muốn đọc tiếp theo.</p><a class="button primary" th:href="@{/books}">Khám phá tủ sách</a></div><div class="cart-layout" th:unless="${#lists.isEmpty(cart.items)}"><section class="cart-lines"><article class="cart-line" th:each="item : ${cart.items}"><a class="cart-thumb" th:href="@{/books/{slug}(slug=${item.slug})}"><img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" th:alt="${item.title}"><span th:unless="${item.imageUrl != null}">本</span></a><div class="cart-line-copy"><h2><a th:href="@{/books/{slug}(slug=${item.slug})}" th:text="${item.title}"></a></h2><p th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'COMMA') + ' ₫ / cuốn'}"></p><div class="cart-line-actions"><form th:action="@{/cart/items/{id}/update(id=${item.id})}" method="post"><input type="number" name="quantity" min="1" th:max="${item.availableStock}" th:value="${item.quantity}" aria-label="Số lượng"><button type="submit">Cập nhật</button></form><form th:action="@{/cart/items/{id}/delete(id=${item.id})}" method="post"><button class="danger-link" type="submit">Bỏ khỏi giỏ</button></form></div></div><strong class="line-total" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></strong></article></section><aside class="cart-summary"><p class="eyebrow">Tạm tính</p><div><span>Tổng cộng</span><strong th:text="${#numbers.formatDecimal(cart.total, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></strong></div><p>Phí vận chuyển được xác nhận khi đặt hàng.</p><a class="button primary" th:href="@{/checkout}">Tiến hành đặt hàng</a><a class="text-link" th:href="@{/books}">Tiếp tục chọn sách</a></aside></div></main><footer th:replace="~{fragments/site :: footer}"></footer></body>
</html>
