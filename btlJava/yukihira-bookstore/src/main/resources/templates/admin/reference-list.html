<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${type.label + ' | Yukihira Admin'}"></title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><header th:replace="~{fragments/admin :: header}"></header><main class="admin-main"><div th:replace="~{fragments/site :: flash}"></div><header class="admin-title"><div><p class="eyebrow">Dữ liệu catalog</p><h1 th:text="${type.label}"></h1></div><a class="button primary" th:href="@{/admin/{type}/new(type=${type.path})}">Thêm mới</a></header><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Tên</th><th th:text="${type.detailsLabel}"></th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="item : ${items}"><td><strong th:text="${item.name}"></strong></td><td th:text="${item.details ?: '—'}"></td><td><span class="status-pill" th:classappend="${item.active ? 'active' : 'inactive'}" th:text="${item.active ? 'Đang dùng' : 'Tạm ẩn'}"></span></td><td class="table-actions"><a th:href="@{/admin/{type}/{id}/edit(type=${type.path},id=${item.id})}">Sửa</a><form th:action="@{/admin/{type}/{id}/delete(type=${type.path},id=${item.id})}" method="post"><button type="submit">Xóa/Ẩn</button></form></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="4">Chưa có dữ liệu. Hãy thêm mục đầu tiên.</td></tr></tbody></table></div></main></body>
</html>
