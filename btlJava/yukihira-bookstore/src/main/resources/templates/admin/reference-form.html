<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${type.label + ' | Yukihira Admin'}"></title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><header th:replace="~{fragments/admin :: header}"></header><main class="admin-main narrow"><a class="back-link" th:href="@{/admin/{type}(type=${type.path})}">← Quay lại danh sách</a><header class="admin-title"><div><p class="eyebrow">Biểu mẫu catalog</p><h1 th:text="${form.id == null ? 'Thêm ' + type.label.toLowerCase() : 'Chỉnh sửa ' + type.label.toLowerCase()}"></h1></div></header><form class="editor-form" th:action="@{/admin/{type}/save(type=${type.path})}" th:object="${form}" method="post"><input type="hidden" th:field="*{id}"><label>Tên<input type="text" th:field="*{name}" required autofocus><small class="field-error" th:errors="*{name}"></small></label><label th:text="${type.detailsLabel}"></label><textarea th:field="*{details}" rows="7"></textarea><small class="field-error" th:errors="*{details}"></small><label class="check-row" th:if="${type.path == 'categories'}"><input type="checkbox" th:field="*{active}"> Hiển thị thể loại này</label><div class="form-actions"><button class="button primary" type="submit">Lưu thay đổi</button><a class="button ghost" th:href="@{/admin/{type}(type=${type.path})}">Hủy</a></div></form></main></body>
</html>
