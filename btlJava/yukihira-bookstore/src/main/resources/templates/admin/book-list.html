<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý sách | Yukihira Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><header th:replace="~{fragments/admin :: header}"></header><main class="admin-main"><div th:replace="~{fragments/site :: flash}"></div><header class="admin-title"><div><p class="eyebrow">Kho catalog</p><h1>Sách</h1></div><a class="button primary" th:href="@{/admin/books/new}">Thêm sách</a></header><form class="admin-search" th:action="@{/admin/books}" method="get"><input type="search" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên, ISBN, tác giả"><button class="button primary">Tìm</button></form><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Sách</th><th>Thể loại</th><th>Giá</th><th>Kho</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="book : ${books.content}"><td><strong th:text="${book.title}"></strong><small th:text="${book.authorLine()}"></small></td><td th:text="${book.categoryName}"></td><td th:text="${#numbers.formatDecimal(book.price, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></td><td th:text="${book.stock}"></td><td><span class="status-pill" th:classappend="${book.status.name() == 'ACTIVE' ? 'active' : 'inactive'}" th:text="${book.status}"></span></td><td class="table-actions"><a th:href="@{/admin/books/{id}/edit(id=${book.id})}">Sửa</a><form th:action="@{/admin/books/{id}/deactivate(id=${book.id})}" method="post"><button type="submit">Ngừng bán</button></form></td></tr><tr th:if="${!books.hasContent()}"><td colspan="6">Chưa có sách phù hợp.</td></tr></tbody></table></div><nav class="pagination" th:if="${books.totalPages > 1}"><a th:if="${books.hasPrevious()}" th:href="@{/admin/books(page=${books.number - 1},keyword=${keyword})}">← Trước</a><span th:text="${'Trang ' + (books.number + 1) + '/' + books.totalPages}"></span><a th:if="${books.hasNext()}" th:href="@{/admin/books(page=${books.number + 1},keyword=${keyword})}">Sau →</a></nav></main></body>
</html>
