<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xử lý đơn | Yukihira Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><header th:replace="~{fragments/admin :: header}"></header><main class="admin-main"><div th:replace="~{fragments/site :: flash}"></div><a class="back-link" th:href="@{/admin/orders}">← Quay lại danh sách</a><header class="admin-title order-admin-title"><div><p class="eyebrow">Phiếu xử lý đơn</p><h1 th:text="${order.orderCode}"></h1><p th:text="${order.createdAtLabel + ' · ' + order.customerEmail}"></p></div><span class="status-stamp" th:classappend="${' order-status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.statusLabel}"></span></header><div class="order-admin-grid"><section class="admin-order-card"><h2>Sách trong kiện</h2><article class="admin-order-line" th:each="item : ${order.items}"><div><strong th:text="${item.title}"></strong><small th:text="${item.quantity + ' × ' + #numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></small></div><b th:text="${#numbers.formatDecimal(item.subtotal, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></b></article><footer><span>Tổng đơn</span><strong th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></strong></footer></section><aside class="admin-order-card"><h2>Thông tin giao nhận</h2><dl class="admin-facts"><div><dt>Người nhận</dt><dd th:text="${order.receiverName}"></dd></div><div><dt>Điện thoại</dt><dd th:text="${order.receiverPhone}"></dd></div><div><dt>Địa chỉ</dt><dd th:text="${order.shippingAddress}"></dd></div><div><dt>Thanh toán</dt><dd th:text="${order.paymentMethodLabel + ' · ' + order.paymentStatusLabel}"></dd></div><div th:if="${order.note != null}"><dt>Ghi chú</dt><dd th:text="${order.note}"></dd></div></dl><form class="status-form" th:if="${!#lists.isEmpty(order.allowedTransitions)}" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post"><label>Chuyển trạng thái<select name="status" required><option th:each="status : ${order.allowedTransitions}" th:value="${status}" th:text="${status.label}"></option></select></label><button class="button primary" type="submit">Cập nhật đơn</button></form><p class="terminal-note" th:if="${#lists.isEmpty(order.allowedTransitions)}">Đơn hàng đã kết thúc vòng xử lý.</p></aside></div></main></body>
</html>
