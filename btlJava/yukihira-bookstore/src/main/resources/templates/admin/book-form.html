<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biên tập sách | Yukihira Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><header th:replace="~{fragments/admin :: header}"></header><main class="admin-main narrow"><a class="back-link" th:href="@{/admin/books}">← Quay lại danh sách</a><header class="admin-title"><div><p class="eyebrow">Phiếu nhập sách</p><h1 th:text="${form.id == null ? 'Thêm sách mới' : 'Chỉnh sửa sách'}"></h1></div></header><form class="editor-form" th:action="@{/admin/books/save}" th:object="${form}" method="post"><input type="hidden" th:field="*{id}"><div class="editor-grid two"><label>Tên sách<input type="text" th:field="*{title}" required><small class="field-error" th:errors="*{title}"></small></label><label>ISBN<input type="text" th:field="*{isbn}"><small class="field-error" th:errors="*{isbn}"></small></label></div><label>Mô tả<textarea th:field="*{description}" rows="8"></textarea><small class="field-error" th:errors="*{description}"></small></label><div class="editor-grid three"><label>Giá bán<input type="number" th:field="*{price}" min="0" step="1000" required><small class="field-error" th:errors="*{price}"></small></label><label>Tồn kho<input type="number" th:field="*{stock}" min="0" required><small class="field-error" th:errors="*{stock}"></small></label><label>Trạng thái<select th:field="*{status}"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option></select></label></div><label>URL ảnh bìa<input type="url" th:field="*{imageUrl}" placeholder="https://..."><small class="field-error" th:errors="*{imageUrl}"></small></label><div class="editor-grid two"><label>Thể loại<select th:field="*{categoryId}" required><option value="">Chọn thể loại</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select><small class="field-error" th:errors="*{categoryId}"></small></label><label>Nhà xuất bản<select th:field="*{publisherId}"><option value="">Chưa xác định</option><option th:each="publisher : ${publishers}" th:value="${publisher.id}" th:text="${publisher.name}"></option></select></label></div><fieldset><legend>Tác giả</legend><div class="checkbox-grid"><label th:each="author : ${authors}"><input type="checkbox" th:field="*{authorIds}" th:value="${author.id}"><span th:text="${author.name}"></span></label></div></fieldset><div class="form-actions"><button class="button primary" type="submit">Lưu sách</button><a class="button ghost" th:href="@{/admin/books}">Hủy</a></div></form></main></body>
</html>
