<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Khách hàng')}"></head>
<body class="admin-page">
<th:block th:replace="~{fragments/admin :: header}"></th:block>
<main id="main-content" tabindex="-1" class="admin-main">
    <div th:replace="~{fragments/admin :: flash}"></div>

    <header class="admin-title"><div><h1>Khách hàng</h1><p>Tra cứu hồ sơ, lịch sử mua sách và kiểm soát quyền đăng nhập.</p></div></header>
    <section class="panel"><form class="filter-bar" th:action="@{/admin/users}" method="get">
        <label class="filter-keyword">Tìm khách hàng<input type="search" name="keyword" th:value="${keyword}" placeholder="Họ tên, email, số điện thoại"></label><label>Trạng thái<select name="status"><option value="">Tất cả trạng thái</option><option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}" th:selected="${status == selectedStatus}"></option></select></label>
        <button class="button primary" type="submit">Lọc khách hàng</button><a class="button ghost" th:href="@{/admin/users}">Xóa lọc</a>
    </form><div class="data-table-wrap" tabindex="0" role="region" aria-label="Danh sách khách hàng"><table class="data-table"><thead><tr><th scope="col">Khách hàng</th><th scope="col">Điện thoại</th><th scope="col">Ngày tham gia</th><th scope="col">Trạng thái</th><th scope="col">Thao tác</th></tr></thead><tbody>
        <tr th:each="user : ${users.content}"><td><strong><a th:href="@{/admin/users/{id}(id=${user.id})}" th:text="${user.fullName}"></a></strong><small th:text="${user.email}"></small></td><td th:text="${user.phone ?: 'Chưa cập nhật'}"></td><td th:text="${user.createdAtLabel}"></td><td><span class="status-pill" th:classappend="${user.status.name() == 'ACTIVE' ? 'active' : 'inactive'}" th:text="${user.status.label}"></span></td>
            <td><div class="table-actions"><a th:href="@{/admin/users/{id}(id=${user.id})}">Hồ sơ</a><form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post" th:attr="data-confirm=${(user.status.name() == 'ACTIVE' ? 'Khóa tài khoản ' : 'Mở khóa tài khoản ') + user.email + '?'}">
                <input type="hidden" name="status" th:value="${user.status.name() == 'ACTIVE' ? 'LOCKED' : 'ACTIVE'}"><button type="submit" th:classappend="${user.status.name() == 'ACTIVE' ? 'danger-link' : ''}" th:text="${user.status.name() == 'ACTIVE' ? 'Khóa' : 'Mở khóa'}"></button>
            </form></div></td>
        </tr><tr th:if="${!users.hasContent()}"><td colspan="5" class="empty-cell"><strong>Chưa có khách hàng phù hợp</strong>Thử đổi bộ lọc. Các tài khoản đăng ký mới sẽ xuất hiện ở đây.</td></tr>
    </tbody></table></div></section>
    <nav th:replace="~{fragments/admin :: pagination(${users}, @{/admin/users(page=${users.number - 1},keyword=${keyword},status=${selectedStatus})}, @{/admin/users(page=${users.number + 1},keyword=${keyword},status=${selectedStatus})})}"></nav>

</main>
</body>
</html>
