<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Khách hàng | Yukihira Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><header th:replace="~{fragments/admin :: header}"></header><main class="admin-main"><div th:replace="~{fragments/site :: flash}"></div><header class="admin-title"><div><p class="eyebrow">Danh bạ độc giả</p><h1>Khách hàng</h1><p>Tìm kiếm và kiểm soát trạng thái truy cập tài khoản.</p></div></header><form class="order-filter" th:action="@{/admin/users}" method="get"><label>Tìm khách hàng<input type="search" name="keyword" th:value="${keyword}" placeholder="Họ tên, email, điện thoại"></label><label>Trạng thái<select name="status"><option value="">Tất cả trạng thái</option><option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}" th:selected="${status == selectedStatus}"></option></select></label><button class="button primary" type="submit">Lọc danh sách</button><a class="reset-link" th:href="@{/admin/users}">Xóa lọc</a></form><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Khách hàng</th><th>Liên hệ</th><th>Địa chỉ</th><th>Tham gia</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="user : ${users.content}"><td><strong th:text="${user.fullName}"></strong><small th:text="${user.email}"></small></td><td th:text="${user.phone == null ? 'Chưa cập nhật' : user.phone}"></td><td th:text="${user.address == null ? 'Chưa cập nhật' : user.address}"></td><td th:text="${user.createdAtLabel}"></td><td><span class="status-pill" th:classappend="${user.status.name() == 'ACTIVE' ? ' active' : ' inactive'}" th:text="${user.status.label}"></span></td><td class="table-actions"><form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post"><input type="hidden" name="status" th:value="${user.status.name() == 'ACTIVE' ? 'LOCKED' : 'ACTIVE'}"><button type="submit" th:text="${user.status.name() == 'ACTIVE' ? 'Khóa' : 'Mở khóa'}"></button></form></td></tr><tr th:if="${!users.hasContent()}"><td colspan="6">Chưa có khách hàng phù hợp.</td></tr></tbody></table></div><nav class="pagination" th:if="${users.totalPages > 1}"><a th:if="${users.hasPrevious()}" th:href="@{/admin/users(page=${users.number - 1},keyword=${keyword},status=${selectedStatus})}">← Trước</a><span th:text="${'Trang ' + (users.number + 1) + '/' + users.totalPages}"></span><a th:if="${users.hasNext()}" th:href="@{/admin/users(page=${users.number + 1},keyword=${keyword},status=${selectedStatus})}">Sau →</a></nav></main></body>
</html>
