<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Báo cáo | Yukihira Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><header th:replace="~{fragments/admin :: header}"></header><main class="admin-main"><header class="admin-title"><div><p class="eyebrow">Báo cáo vận hành</p><h1>Sổ cửa hàng</h1><p>Số liệu được tổng hợp trực tiếp từ đơn hàng đã lưu.</p></div></header><section class="metric-grid report-metrics"><article class="metric-card revenue-card"><span>Doanh thu hoàn thành</span><strong th:text="${#numbers.formatDecimal(dashboard.completedRevenue, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></strong></article><article class="metric-card"><span>Tổng đơn</span><strong th:text="${dashboard.totalOrders}"></strong></article><article class="metric-card"><span>Chờ xác nhận</span><strong th:text="${dashboard.pendingOrders}"></strong></article><article class="metric-card"><span>Khách hàng</span><strong th:text="${dashboard.customerCount}"></strong></article><article class="metric-card"><span>Sách mở bán</span><strong th:text="${dashboard.activeBookCount}"></strong></article></section><section class="report-table"><div class="panel-heading"><div><p class="eyebrow">Xếp theo số lượng</p><h2>Top sách bán chạy</h2></div></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Hạng</th><th>Sách</th><th>Đã bán</th><th>Doanh thu</th></tr></thead><tbody><tr th:each="book, iter : ${dashboard.topSellingBooks}"><td th:text="${'#' + iter.count}"></td><td><strong th:text="${book.title}"></strong></td><td th:text="${book.quantitySold + ' cuốn'}"></td><td th:text="${#numbers.formatDecimal(book.revenue, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></td></tr><tr th:if="${#lists.isEmpty(dashboard.topSellingBooks)}"><td colspan="4">Chưa có đơn hoàn thành để tổng hợp.</td></tr></tbody></table></div></section></main></body>
</html>
