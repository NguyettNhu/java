<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý đơn | Yukihira Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><header th:replace="~{fragments/admin :: header}"></header><main class="admin-main"><div th:replace="~{fragments/site :: flash}"></div><header class="admin-title"><div><p class="eyebrow">Bàn đóng gói</p><h1>Đơn hàng</h1><p>Theo dõi từ lúc nhận đơn tới khi giao xong.</p></div></header><form class="order-filter" th:action="@{/admin/orders}" method="get"><label>Tìm đơn<input type="search" name="keyword" th:value="${keyword}" placeholder="Mã đơn, người nhận, email"></label><label>Trạng thái<select name="status"><option value="">Tất cả trạng thái</option><option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}" th:selected="${status == selectedStatus}"></option></select></label><button class="button primary" type="submit">Lọc danh sách</button><a class="reset-link" th:href="@{/admin/orders}">Xóa lọc</a></form><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Thời gian</th><th>Giá trị</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="order : ${orders.content}"><td><strong th:text="${order.orderCode}"></strong><small th:text="${order.itemCount + ' cuốn'}"></small></td><td><strong th:text="${order.customerName}"></strong><small th:text="${order.customerEmail}"></small></td><td th:text="${order.createdAtLabel}"></td><td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></td><td><span class="status-pill" th:classappend="${' order-status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.statusLabel}"></span></td><td class="table-actions"><a th:href="@{/admin/orders/{id}(id=${order.id})}">Xử lý</a></td></tr><tr th:if="${!orders.hasContent()}"><td colspan="6">Chưa có đơn hàng phù hợp.</td></tr></tbody></table></div><nav class="pagination" th:if="${orders.totalPages > 1}"><a th:if="${orders.hasPrevious()}" th:href="@{/admin/orders(page=${orders.number - 1},keyword=${keyword},status=${selectedStatus})}">← Trước</a><span th:text="${'Trang ' + (orders.number + 1) + '/' + orders.totalPages}"></span><a th:if="${orders.hasNext()}" th:href="@{/admin/orders(page=${orders.number + 1},keyword=${keyword},status=${selectedStatus})}">Sau →</a></nav></main></body>
</html>
