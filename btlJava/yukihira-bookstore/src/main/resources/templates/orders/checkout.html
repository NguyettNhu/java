<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xác nhận đơn | Yukihira Books</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/site :: header}"></header><main class="order-shell"><a class="back-link" th:href="@{/cart}">← Quay lại giỏ sách</a><header class="page-title"><p class="eyebrow">Bước cuối cùng</p><h1>Gửi đơn sách</h1><p>Kiểm tra nơi nhận trước khi chúng tôi đóng gói.</p></header><form class="checkout-layout" th:action="@{/orders}" th:object="${form}" method="post"><section class="editor-form checkout-form"><p class="form-alert error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p><div class="editor-grid two"><label>Người nhận<input type="text" th:field="*{receiverName}" autocomplete="name" required><small class="field-error" th:errors="*{receiverName}"></small></label><label>Số điện thoại<input type="tel" th:field="*{receiverPhone}" autocomplete="tel" inputmode="tel" pattern="(?:\+84|0)(?:3[2-9]|5[2689]|7[06-9]|8[1-689]|9[0-46-9])[0-9]{7}" maxlength="12" placeholder="0912345678" title="Nhập số điện thoại Việt Nam gồm 10 chữ số, bắt đầu bằng 0" required><small class="optional">Dùng 10 chữ số bắt đầu bằng 0 hoặc mã vùng +84.</small><small class="field-error" th:errors="*{receiverPhone}"></small></label></div><label>Địa chỉ giao hàng<input type="text" th:field="*{shippingAddress}" autocomplete="street-address" minlength="10" maxlength="255" placeholder="Số nhà, đường, phường/xã, quận/huyện" title="Nhập địa chỉ cụ thể từ 10 đến 255 ký tự" required><small class="optional">Ghi rõ số nhà/thôn, đường, phường/xã và quận/huyện.</small><small class="field-error" th:errors="*{shippingAddress}"></small></label><label>Ghi chú cho cửa hàng <span class="optional">không bắt buộc</span><textarea th:field="*{note}" rows="4" placeholder="Ví dụ: giao giờ hành chính"></textarea><small class="field-error" th:errors="*{note}"></small></label><fieldset><legend>Thanh toán</legend><label class="payment-choice" th:each="method : ${paymentMethods}"><input type="radio" th:field="*{paymentMethod}" th:value="${method}"><span><strong th:text="${method.label}"></strong><small th:text="${method.name() == 'COD' ? 'Thanh toán trực tiếp khi sách được giao tới.' : 'Cửa hàng sẽ liên hệ để xác nhận thông tin chuyển khoản.'}"></small></span></label><small class="field-error" th:errors="*{paymentMethod}"></small></fieldset></section><aside class="cart-summary checkout-summary"><p class="eyebrow">Phiếu đặt sách</p><ol class="checkout-lines"><li th:each="item : ${cart.items}"><span><strong th:text="${item.title}"></strong><small th:text="${item.quantity + ' × ' + #numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></small></span><b th:text="${#numbers.formatDecimal(item.subtotal, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></b></li></ol><div><span>Tổng thanh toán</span><strong th:text="${#numbers.formatDecimal(cart.total, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></strong></div><p>Giá và tồn kho được xác nhận lại an toàn khi bạn gửi đơn.</p><button class="button primary" type="submit">Xác nhận đặt hàng</button></aside></form></main><footer th:replace="~{fragments/site :: footer}"></footer></body>
</html>
