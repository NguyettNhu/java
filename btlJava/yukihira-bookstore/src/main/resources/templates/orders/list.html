<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đơn hàng | Yukihira Books</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/site :: header}"></header><div th:replace="~{fragments/site :: flash}"></div><main class="order-shell"><header class="page-title"><p class="eyebrow">Nhật ký mua sách</p><h1>Đơn hàng</h1><p th:text="${#lists.size(orders) + ' đơn đã tạo'}"></p></header><div class="empty-state" th:if="${#lists.isEmpty(orders)}"><span>包</span><h2>Chưa có kiện sách nào.</h2><p>Đơn đầu tiên của bạn sẽ xuất hiện ở đây.</p><a class="button primary" th:href="@{/books}">Chọn sách ngay</a></div><section class="order-ledger" th:unless="${#lists.isEmpty(orders)}"><a class="order-ticket" th:each="order : ${orders}" th:href="@{/orders/{id}(id=${order.id})}"><div><span class="order-code" th:text="${order.orderCode}"></span><h2 th:text="${order.itemCount + ' cuốn sách'}"></h2><p th:text="${order.createdAtLabel}"></p></div><div class="ticket-status"><span class="status-pill" th:classappend="${' order-status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.statusLabel}"></span><strong th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></strong><small th:text="${order.paymentStatusLabel}"></small></div><span class="ticket-arrow">→</span></a></section></main><footer th:replace="~{fragments/site :: footer}"></footer></body>
</html>
