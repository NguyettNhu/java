<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div class="data-table-wrap" th:fragment="orders(orders)" tabindex="0" role="region" aria-label="Danh sách đơn hàng">
    <table class="data-table"><thead><tr><th scope="col">Mã đơn</th><th scope="col">Khách hàng</th><th scope="col">Ngày đặt</th><th scope="col" class="numeric">Tổng tiền</th><th scope="col">Trạng thái</th><th scope="col"><span class="sr-only">Chi tiết</span></th></tr></thead>
        <tbody><tr th:each="order : ${orders}">
            <td><a th:href="@{/admin/orders/{id}(id=${order.id})}" th:text="${order.orderCode}"></a><small th:text="${order.itemCount + ' cuốn'}"></small></td>
            <td><strong th:text="${order.customerName}"></strong><small th:text="${order.customerEmail}"></small></td>
            <td style="white-space:nowrap" th:text="${order.createdAtLabel}"></td><td class="numeric" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></td>
            <td><span class="status-pill" th:classappend="${'order-status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.statusLabel}"></span><small th:text="${order.paymentStatusLabel}"></small></td>
            <td><a th:href="@{/admin/orders/{id}(id=${order.id})}">Chi tiết</a></td>
        </tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="6" class="empty-cell"><strong>Chưa có đơn hàng phù hợp</strong>Đơn hàng sẽ xuất hiện khi khách hoàn tất đặt sách. Nếu đang lọc, hãy thử khoảng ngày khác.</td></tr></tbody>
    </table>
</div>
</body></html>
